name: Performance F1-167 - PostgreSQL scoped campaign generations
on:
  push:
    branches:
      - dev/perf-f1-167-pg16-campaign-scope-epochs-2026-11-11
  pull_request:
    paths:
      - 'database/lab-migrations/f167_pg16_scope_generation_fence_ci.sql'
      - 'tests/Standalone/F167Pg16ScopeGenerationTest.php'
      - '.github/workflows/perf-f1-167-pg16-generation-fence-ci.yml'
permissions:
  contents: read
jobs:
  pg16-generational-review-quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: perf_f162_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_f162_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: testing
      PERF_F52_SCOPE_LAB: '1'
      PERF_F162_PG_LAB: '1'
      PERF_F163_PHP_BRIDGE_LAB: '1'
      PERF_F164_PG_SCOPE_LAB: '1'
      PERF_F165_CAMPAIGN_LOCK_LAB: '1'
      PERF_F166_READ_DASHBOARD_LAB: '1'
      PERF_F167_SCOPE_EPOCH_LAB: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: perf_f162_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,pgsql
          coverage: none
      - name: Initialize synthetic PostgreSQL16 tenant/campaign/review and read views
        shell: bash
        run: |
          set -euo pipefail
          test "$PGDATABASE" = perf_f162_ci
          psql -v ON_ERROR_STOP=1 -f database/lab-migrations/f162_pg16_tenant_review_registry_ci.sql
          psql -v ON_ERROR_STOP=1 -f database/lab-migrations/f164_pg16_managed_campaign_boundary_ci.sql
          psql -v ON_ERROR_STOP=1 -f database/lab-migrations/f165_pg16_campaign_retirement_lock_audit_ci.sql
          psql -v ON_ERROR_STOP=1 -f database/lab-migrations/f166_pg16_readonly_dashboard_views_ci.sql
      - name: Verify old F162 to F166 behavior before migration
        shell: bash
        run: |
          set -euo pipefail
          php tests/Standalone/F162Pg16TenantReviewRegistryTest.php
          psql -v ON_ERROR_STOP=1 -c 'TRUNCATE perf_f162.events,perf_f162.reviews RESTART IDENTITY CASCADE'
          php tests/Standalone/F163Pg16SyntheticReviewBridgeTest.php
          php tests/Standalone/F164Pg16ManagedCampaignBoundaryTest.php
          php tests/Standalone/F165Pg16CampaignRetirementLockAuditTest.php
          psql -v ON_ERROR_STOP=1 -c 'TRUNCATE perf_f162.events,perf_f162.reviews RESTART IDENTITY CASCADE'
          php tests/Standalone/F166Pg16ReadOnlyDashboardTest.php
      - name: Upgrade only the disposable laboratory schema and verify fresh generations
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f database/lab-migrations/f167_pg16_scope_generation_fence_ci.sql
          php -l tests/Standalone/F167Pg16ScopeGenerationTest.php
          php tests/Standalone/F167Pg16ScopeGenerationTest.php
          if grep -R -E 'f167_pg16_scope_generation_fence|PERF_F167_SCOPE_EPOCH_LAB' app/ routes/ bootstrap/ database/migrations/; then
            echo 'FAIL: F167 lab migration included in operational application'
            exit 1
          fi
