name: Performance F1-166 - tenant-scoped PostgreSQL read-only dashboard
on:
  push:
    branches:
      - dev/perf-f1-166-pg16-tenant-readonly-dashboard-2026-11-11
  pull_request:
    paths:
      - 'database/lab-migrations/f166_pg16_readonly_dashboard_views_ci.sql'
      - 'src/Domain/Performance/F166Pg16ReadOnlyDashboard.php'
      - 'tests/Standalone/F166Pg16ReadOnlyDashboardTest.php'
      - '.github/workflows/perf-f1-166-pg16-readonly-dashboard-ci.yml'
permissions:
  contents: read
jobs:
  pg16-security-invoker:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: perf_f162_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_f162_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: testing
      PERF_F52_SCOPE_LAB: '1'
      PERF_F162_PG_LAB: '1'
      PERF_F163_PHP_BRIDGE_LAB: '1'
      PERF_F164_PG_SCOPE_LAB: '1'
      PERF_F165_CAMPAIGN_LOCK_LAB: '1'
      PERF_F166_READ_DASHBOARD_LAB: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: perf_f162_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,pgsql
          coverage: none
      - name: Apply only lab-scoped PG16 schemas and security-invoker views
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          psql -v ON_ERROR_STOP=1 -f database/lab-migrations/f162_pg16_tenant_review_registry_ci.sql
          psql -v ON_ERROR_STOP=1 -f database/lab-migrations/f164_pg16_managed_campaign_boundary_ci.sql
          psql -v ON_ERROR_STOP=1 -f database/lab-migrations/f165_pg16_campaign_retirement_lock_audit_ci.sql
          psql -v ON_ERROR_STOP=1 -f database/lab-migrations/f166_pg16_readonly_dashboard_views_ci.sql
      - name: Regress tenant rights, PHP bridge, campaign scope and retirement locks
        shell: bash
        run: |
          set -euo pipefail
          php tests/Standalone/F162Pg16TenantReviewRegistryTest.php
          psql -v ON_ERROR_STOP=1 -c 'TRUNCATE perf_f162.events,perf_f162.reviews RESTART IDENTITY CASCADE'
          php tests/Standalone/F163Pg16SyntheticReviewBridgeTest.php
          php tests/Standalone/F164Pg16ManagedCampaignBoundaryTest.php
          php tests/Standalone/F165Pg16CampaignRetirementLockAuditTest.php
      - name: Verify actual view RLS and quarantined historical reviews in PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Domain/Performance/F166Pg16ReadOnlyDashboard.php
          php -l tests/Standalone/F166Pg16ReadOnlyDashboardTest.php
          php tests/Standalone/F166Pg16ReadOnlyDashboardTest.php
          if grep -R -E 'F166Pg16ReadOnlyDashboard|PERF_F166_READ_DASHBOARD_LAB|f166_pg16_readonly_dashboard_views' app/ routes/ bootstrap/ database/migrations/; then
            echo 'FAIL: F166 experimental view in operational application'
            exit 1
          fi
