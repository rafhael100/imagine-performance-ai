name: Performance F1-148 - isolated no-op workload verification
on:
  push:
    branches:
      - dev/perf-f1-148-no-egress-workload-identity-ci-2026-11-10
  pull_request:
    paths:
      - 'database/lab-migrations/f139_locked_anchor_admission_ci.sql'
      - 'database/lab-migrations/f139_anchor_guarded_rowlock_acl_ci.sql'
      - 'tests/Standalone/F145IndependentDispatchAfterQuadRestorePgTest.php'
      - 'src/Lab/F145IndependentDispatchBoundary.php'
      - 'src/Lab/F146TerminalGrantIssuer.php'
      - 'src/Lab/F146SyntheticExecutor.php'
      - 'src/Lab/F147StickyQuarantineExecutor.php'
      - 'bin/lab/f147_quarantined_synthetic_executor.php'
      - 'tests/Standalone/F147ConcurrentQuarantineExecutorTest.php'
      - 'bin/lab/f146_synthetic_executor.php'
      - 'tests/Standalone/F146IsolatedSyntheticExecutorTest.php'
      - 'src/Lab/F143LiveOracleRegistration.php'
      - 'database/lab-migrations/f143_oracle_live_redemption_ci.sql'
      - 'database/lab-migrations/f143_primary_sql_oracle_ci.sql'
      - 'src/Lab/F142JournalAttestedRegistration.php'
      - 'database/lab-migrations/f142_primary_journal_attested_gate_ci.sql'
      - 'src/Lab/F141SignedJournalAuthority.php'
      - 'src/Lab/F141JournalGatedRegistration.php'
      - 'database/lab-migrations/f136_witness_atomic_redemption_ci.sql'
      - 'src/Lab/F136OnlineWitnessRedemption.php'
      - 'tests/Standalone/F136OnlineWitnessRedemptionPgTest.php'
      - 'src/Lab/F139LockedAnchorRegistration.php'
      - '.github/workflows/perf-f1-148-no-egress-workload-ci.yml'
permissions:
  contents: read
jobs:
  two-db-epoch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      primary:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f132-admin-only
          POSTGRES_DB: perf_f132_ci
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_f132_ci"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
      witness:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f132-witness-admin-only
          POSTGRES_DB: perf_f132_witness_ci
        ports:
          - '127.0.0.1:5433:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_f132_witness_ci"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
      anchor:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f138-admin-only
          POSTGRES_DB: perf_f138_anchor_ci
        ports:
          - '127.0.0.1:5434:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_f138_anchor_ci"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
      oracle:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f143-admin-only
          POSTGRES_DB: perf_f143_oracle_ci
        ports:
          - '127.0.0.1:5435:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_f143_oracle_ci"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      PERF_F132_LAB: '1'
      PERF_F134_LAB: '1'
      PERF_F136_LAB: '1'
      PERF_F137_LAB: '1'
      PERF_F138_LAB: '1'
      PERF_F139_LAB: '1'
      PERF_F140_LAB: '1'
      PERF_F141_LAB: '1'
      PERF_F142_LAB: '1'
      PERF_F143_LAB: '1'
      PERF_F144_LAB: '1'
      PERF_F145_LAB: '1'
      PERF_F146_LAB: '1'
      PERF_F147_LAB: '1'
      PERF_F148_LAB: '1'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: perf_f132_ci
      PGUSER: postgres
      PGPASSWORD: ci-f132-admin-only
      WITNESS_DB: perf_f132_witness_ci
      WITNESS_PASSWORD: ci-f132-witness-admin-only
      PERF_F131_PRIMARY_PASSWORD: ci-f131-primary-only
      PERF_F131_WITNESS_PASSWORD: ci-f131-witness-only
      PERF_F132_PRIMARY_PASSWORD: ci-f132-primary-only
      PERF_F132_WITNESS_PASSWORD: ci-f132-witness-only
      PERF_F134_PRIMARY_PASSWORD: ci-f134-primary-only
      PERF_F134_WITNESS_PASSWORD: ci-f134-witness-only
      PERF_F136_PRIMARY_PASSWORD: ci-f136-primary-only
      PERF_F136_ISSUER_PASSWORD: ci-f136-issuer-only
      PERF_F136_REDEEMER_PASSWORD: ci-f136-redeemer-only
      ANCHOR_DB: perf_f138_anchor_ci
      ANCHOR_PASSWORD: ci-f138-admin-only
      PERF_F138_ANCHOR_READER_PASSWORD: ci-f138-reader-only
      PERF_F138_PRIMARY_PASSWORD: ci-f138-primary-only
      PERF_F139_PRIMARY_PASSWORD: ci-f139-primary-only
      PERF_F142_PRIMARY_PASSWORD: ci-f142-primary-only
      ORACLE_DB: perf_f143_oracle_ci
      ORACLE_PASSWORD: ci-f143-admin-only
      PERF_F143_PRIMARY_PASSWORD: ci-f143-primary-only
      PERF_F143_ISSUER_PASSWORD: ci-f143-issuer-only
      PERF_F143_REDEEMER_PASSWORD: ci-f143-redeemer-only
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install disposable PHP 8.4 pgsql runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo,pdo_pgsql,sodium
      - name: Lint, regression and runtime isolation
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Lab/F132EpochFencedRegistration.php
          php -l tests/Standalone/F132EpochRestoreFencePgTest.php
          php tests/Standalone/F127AmbiguousWitnessQuarantineTest.php
          php tests/Standalone/F128SyntheticWitnessReconciliationTest.php
          if grep -R -E 'F132EpochFencedRegistration|perf_f132_primary|perf_f132_witness' routes/ app/ bootstrap/; then
            echo 'FAIL F132 lab leaked into runtime'
            exit 1
          fi
      - name: Create ephemeral primary schema and fenced role
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F132_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          pg_isready -h 127.0.0.1 -p 5432 -d perf_f132_ci -U postgres
          PGPASSWORD="$WITNESS_PASSWORD" pg_isready -h 127.0.0.1 -p 5433 -d perf_f132_witness_ci -U postgres
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f129_writer LOGIN PASSWORD 'ci-f129-writer-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f129_failure_simulator LOGIN PASSWORD 'ci-f129-sim-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f131_primary_bridge LOGIN PASSWORD 'ci-f131-primary-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f132_primary_bridge LOGIN PASSWORD 'ci-f132-primary-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f129_disposable_quarantine_journal.sql
          psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f131_cutover_primary_bridge_ci.sql
          psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f132_primary_generation_gate_ci.sql
      - name: Create ephemeral witness schema and epoch floor role
        shell: bash
        run: |
          set -euo pipefail
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f130_writer LOGIN PASSWORD 'ci-f130-writer-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f131_witness_bridge LOGIN PASSWORD 'ci-f131-witness-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f132_witness_bridge LOGIN PASSWORD 'ci-f132-witness-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f130_disposable_external_witness.sql
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f131_cutover_witness_bridge_ci.sql
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f132_witness_epoch_floor_ci.sql
      - name: Generate random CI-only HMAC key without printing it
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "PERF_F134_CI_KEY=$key" >> "$GITHUB_ENV"
      - name: Apply restricted SQL issuer and verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F134_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f134_primary_bridge LOGIN PASSWORD 'ci-f134-primary-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE perf_f134_witness_bridge LOGIN PASSWORD 'ci-f134-witness-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPASSWORD="$WITNESS_PASSWORD" PGPORT=5433 PGDATABASE="$WITNESS_DB" \
            psql -X -v ON_ERROR_STOP=1 -v ci_key="$PERF_F134_CI_KEY" \
            -f database/lab-migrations/f134_witness_signed_permit_ci.sql
          psql -X -v ON_ERROR_STOP=1 -v ci_key="$PERF_F134_CI_KEY" \
            -f database/lab-migrations/f134_primary_verified_permit_ci.sql
      - name: Create disposable F136 issuer, redeemer and primary bridge roles
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F136_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE perf_f136_issuer LOGIN PASSWORD 'ci-f136-issuer-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" psql -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE perf_f136_redeemer LOGIN PASSWORD 'ci-f136-redeemer-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE perf_f136_primary_bridge LOGIN PASSWORD 'ci-f136-primary-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
      - name: Apply witness irreversible redemption and primary FDW function
        shell: bash
        run: |
          set -euo pipefail
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f136_witness_atomic_redemption_ci.sql
          psql -X -v ON_ERROR_STOP=1 -v redeemer_password="$PERF_F136_REDEEMER_PASSWORD" \
            -f database/lab-migrations/f136_primary_fdw_redemption_ci.sql
          php -l src/Lab/F136OnlineWitnessRedemption.php
          php -l tests/Standalone/F136OnlineWitnessRedemptionPgTest.php
          if grep -R -E 'F136OnlineWitnessRedemption|perf_f136_witness|perf_f136_primary' routes/ app/ bootstrap/; then
            echo 'FAIL F136 lab wired into production routing'
            exit 1
          fi
      - name: Initialize third CI-only epoch authority and primary FDW gate
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F138_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          test "$ANCHOR_DB" = perf_f138_anchor_ci
          PGPASSWORD="$ANCHOR_PASSWORD" pg_isready -h 127.0.0.1 -p 5434 -d "$ANCHOR_DB" -U postgres
          PGPORT=5434 PGDATABASE="$ANCHOR_DB" PGPASSWORD="$ANCHOR_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f138_anchor_reader LOGIN PASSWORD 'ci-f138-reader-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPORT=5434 PGDATABASE="$ANCHOR_DB" PGPASSWORD="$ANCHOR_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f138_third_anchor_epoch_ci.sql
          psql -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE perf_f138_primary_bridge LOGIN PASSWORD 'ci-f138-primary-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -v anchor_reader_password="$PERF_F138_ANCHOR_READER_PASSWORD" \
            -f database/lab-migrations/f138_primary_third_anchor_gate_ci.sql
          php -l src/Lab/F138ThirdAnchorRegistration.php
          php -l tests/Standalone/F138ThirdAnchorRollbackPgTest.php
          if grep -R -E 'F138ThirdAnchorRegistration|perf_f138_anchor|perf_f138_primary' routes/ app/ bootstrap/; then
            echo 'FAIL: F138 CI-only gate referenced by product runtime'
            exit 1
          fi
      - name: Install CI-only row-lock SQL and cut the former direct bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F139_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          test "$ANCHOR_DB" = perf_f138_anchor_ci
          psql -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE perf_f139_primary_bridge LOGIN PASSWORD 'ci-f139-primary-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPORT=5434 PGDATABASE="$ANCHOR_DB" PGPASSWORD="$ANCHOR_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f139_anchor_guarded_rowlock_acl_ci.sql
          psql -X -v ON_ERROR_STOP=1 -f database/lab-migrations/f139_locked_anchor_admission_ci.sql
          php -l src/Lab/F139LockedAnchorRegistration.php
          php -l tests/Standalone/F139AnchorLockRacePgTest.php
          if grep -R -E 'F139LockedAnchorRegistration|perf_f139_primary|PERF_F139_LAB' routes/ app/ bootstrap/; then
            echo 'FAIL: F139 locked-anchor lab exposed in production routing'
            exit 1
          fi
      - name: Create restricted F142 bridge and random masked journal HMAC key
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F142_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          test "$WITNESS_DB" = perf_f132_witness_ci
          test "$ANCHOR_DB" = perf_f138_anchor_ci
          f142_key="$(openssl rand -hex 32)"
          echo "::add-mask::$f142_key"
          echo "PERF_F142_CI_KEY=$f142_key" >> "$GITHUB_ENV"
          psql -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE perf_f142_primary_bridge LOGIN PASSWORD 'ci-f142-primary-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -v f142_mac_key="$f142_key" \
            -f database/lab-migrations/f142_primary_journal_attested_gate_ci.sql
      - name: Create disposable online oracle with restricted issuer and redeemer roles
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F143_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          test "$ORACLE_DB" = perf_f143_oracle_ci
          PGPASSWORD="$ORACLE_PASSWORD" pg_isready -h 127.0.0.1 -p 5435 -d "$ORACLE_DB" -U postgres
          PGPORT=5435 PGDATABASE="$ORACLE_DB" PGPASSWORD="$ORACLE_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f143_oracle_issuer LOGIN PASSWORD 'ci-f143-issuer-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPORT=5435 PGDATABASE="$ORACLE_DB" PGPASSWORD="$ORACLE_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_f143_oracle_redeemer LOGIN PASSWORD 'ci-f143-redeemer-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          PGPORT=5435 PGDATABASE="$ORACLE_DB" PGPASSWORD="$ORACLE_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -v f142_mac_key="$PERF_F142_CI_KEY" \
              -f database/lab-migrations/f143_oracle_live_redemption_ci.sql
          psql -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE perf_f143_primary_bridge LOGIN PASSWORD 'ci-f143-primary-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -v oracle_redeemer_password="$PERF_F143_REDEEMER_PASSWORD" \
            -f database/lab-migrations/f143_primary_sql_oracle_ci.sql
      - name: Seed A in all four current databases and signed journal
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Lab/F145IndependentDispatchBoundary.php
          php -l tests/Standalone/F145IndependentDispatchAfterQuadRestorePgTest.php
          php tests/Standalone/F145IndependentDispatchAfterQuadRestorePgTest.php seed
      - name: Save FOUR old database snapshots before B
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F145_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          test "$WITNESS_DB" = perf_f132_witness_ci
          test "$ANCHOR_DB" = perf_f138_anchor_ci
          test "$ORACLE_DB" = perf_f143_oracle_ci
          pg_dump -h 127.0.0.1 -d perf_f132_ci --data-only --column-inserts --no-owner --no-privileges \
            --table=perf_f129_lab.circuit --table=perf_f129_lab.receipts \
            --table=perf_f129_lab.uncertainty --table=perf_f132_primary.local_generation \
            --file="$RUNNER_TEMP/f144-old-primary.sql"
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" \
            pg_dump -h 127.0.0.1 -d "$WITNESS_DB" --data-only --column-inserts --no-owner --no-privileges \
            --table=perf_f130_witness.seen_fingerprints --table=perf_f132_witness.epoch_floor \
            --table=perf_f136_witness.issued --file="$RUNNER_TEMP/f144-old-witness.sql"
          PGPORT=5434 PGDATABASE="$ANCHOR_DB" PGPASSWORD="$ANCHOR_PASSWORD" \
            pg_dump -h 127.0.0.1 -d "$ANCHOR_DB" --data-only --column-inserts --no-owner --no-privileges \
            --table=perf_f138_anchor.epoch_floor --file="$RUNNER_TEMP/f144-old-anchor.sql"
          PGPORT=5435 PGDATABASE="$ORACLE_DB" PGPASSWORD="$ORACLE_PASSWORD" \
            pg_dump -h 127.0.0.1 -d "$ORACLE_DB" --data-only --column-inserts --no-owner --no-privileges \
            --table=perf_f143_oracle.floor --table=perf_f143_oracle.permits \
            --file="$RUNNER_TEMP/f144-old-oracle.sql"
          test -s "$RUNNER_TEMP/f144-old-primary.sql"
          test -s "$RUNNER_TEMP/f144-old-witness.sql"
          test -s "$RUNNER_TEMP/f144-old-anchor.sql"
          test -s "$RUNNER_TEMP/f144-old-oracle.sql"
      - name: Register B with all four newer SQL authorities and capture its MAC
        shell: bash
        run: |
          set -euo pipefail
          php tests/Standalone/F145IndependentDispatchAfterQuadRestorePgTest.php after-snapshot
      - name: Restore all FOUR database ledgers, intentionally preserve file journal
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F145_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          psql -X -v ON_ERROR_STOP=1 \
            -c "TRUNCATE perf_f129_lab.uncertainty,perf_f129_lab.receipts,perf_f129_lab.circuit,perf_f132_primary.local_generation"
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/f144-old-primary.sql" >/dev/null
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 \
            -c "TRUNCATE perf_f136_witness.issued,perf_f130_witness.seen_fingerprints,perf_f132_witness.epoch_floor"
          PGPORT=5433 PGDATABASE="$WITNESS_DB" PGPASSWORD="$WITNESS_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/f144-old-witness.sql" >/dev/null
          PGPORT=5434 PGDATABASE="$ANCHOR_DB" PGPASSWORD="$ANCHOR_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -c "TRUNCATE perf_f138_anchor.epoch_floor"
          PGPORT=5434 PGDATABASE="$ANCHOR_DB" PGPASSWORD="$ANCHOR_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/f144-old-anchor.sql" >/dev/null
          PGPORT=5435 PGDATABASE="$ORACLE_DB" PGPASSWORD="$ORACLE_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 \
            -c "TRUNCATE perf_f143_oracle.permits,perf_f143_oracle.floor"
          PGPORT=5435 PGDATABASE="$ORACLE_DB" PGPASSWORD="$ORACLE_PASSWORD" \
            psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/f144-old-oracle.sql" >/dev/null
      - name: Prove captured-valid MAC replay after four database restores
        shell: bash
        run: |
          set -euo pipefail
          php tests/Standalone/F145IndependentDispatchAfterQuadRestorePgTest.php after-quadruple-restore
          if grep -R -E 'F144FourDatabaseRestoreNegativePgTest|PERF_F145_LAB' routes/ app/ bootstrap/; then
            echo 'FAIL: F144 destructive lab accidentally referenced by production'
            exit 1
          fi
      - name: Verify separate Ed25519 issuer and synthetic-only child executor
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$PERF_F146_LAB" = 1
          test "$PGDATABASE" = perf_f132_ci
          php -l src/Lab/F141SignedJournalAuthority.php
          php -l src/Lab/F146TerminalGrantIssuer.php
          php -l src/Lab/F146SyntheticExecutor.php
          php -l bin/lab/f146_synthetic_executor.php
          php -l tests/Standalone/F146IsolatedSyntheticExecutorTest.php
          php tests/Standalone/F146IsolatedSyntheticExecutorTest.php
