name: Performance F1-56 - safe offline capacity CSV and all synthetic UI regressions

on:
  push:
    branches:
      - dev/perf-f1-56-offline-report-export-2026-11-09
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-f156-offline-csv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csv-offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: testing
      PERF_F52_SCOPE_LAB: '1'
      PERF_F53_PORTAL_PREVIEW_LAB: '1'
      PERF_F55_RENDER_LAB: '1'
      PERF_F56_CSV_LAB: '1'
    steps:
      - name: Checkout restricted Performance source
        uses: actions/checkout@v5
      - name: PHP 8.4 for domain unit tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Run synthetic scope, UI, DTO, CSV regression tests
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Domain/Performance/SyntheticScopeCsvExporter.php
          php -l tests/Unit/SyntheticScopeCsvExporterStandalone.php
          php -l contracts/demo/f56-export-capacity-csv.php
          php tests/Unit/SyntheticManagedScopeLedgerStandalone.php
          php tests/Unit/SyntheticScopeDashboardProjectorStandalone.php
          node tests/ui/test-offline-preview.mjs
          export F55_RENDERED_PREVIEW_FILE="$(mktemp --suffix=.html)"
          export F55_PROJECTED_JSON_FILE="$(mktemp --suffix=.json)"
          trap 'rm -f "$F55_RENDERED_PREVIEW_FILE" "$F55_PROJECTED_JSON_FILE"' EXIT
          php contracts/demo/f53-generate-scope-preview.php > "$F55_PROJECTED_JSON_FILE"
          php contracts/demo/f55-render-offline-preview.php > "$F55_RENDERED_PREVIEW_FILE"
          node tests/ui/test-f55-dto-parity.mjs
          php tests/Unit/SyntheticScopeCsvExporterStandalone.php
      - name: Validate generated CSV encoding, no financial or provider data
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp --suffix=.csv)"
          trap 'rm -f "$tmp"' EXIT
          php contracts/demo/f56-export-capacity-csv.php > "$tmp"
          test "$(head -c 3 "$tmp" | od -An -tx1 | tr -d ' \n')" = efbbbf
          test "$(wc -l < "$tmp")" -eq 3
          grep -q 'NAO CONTRATADO' "$tmp"
          grep -q 'HIPOTESE NAO HOMOLOGADA' "$tmp"
          grep -q 'SEM FATURAMENTO OU EXECUCAO' "$tmp"
          if grep -Eiq 'access_token|provider_account_id|media_spend|price_brl' "$tmp"; then
            echo 'FAIL F56 CSV leaked a provider account or financial field'
            exit 1
          fi
          if APP_ENV=production php contracts/demo/f56-export-capacity-csv.php >/dev/null 2>&1; then
            echo 'FAIL F56 CSV exporter cannot run in production'
            exit 1
          fi
          if PERF_F56_CSV_LAB=0 php contracts/demo/f56-export-capacity-csv.php >/dev/null 2>&1; then
            echo 'FAIL F56 CSV exporter must require synthetic flag'
            exit 1
          fi
      - name: Preserve NO-GO and no customer routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"release_state": "blocked"' contracts/lab/ci/performance-release-no-go.json
          grep -q '"billing_allowed": false' contracts/lab/ci/performance-release-no-go.json
          test ! -e routes/web.php
          test ! -e routes/api.php
          if grep -R -n -E 'SyntheticScopeCsvExporter|PERF_F56_CSV_LAB' app/ routes/ bootstrap/ database/migrations/; then
            echo 'FAIL F56 synthetic CSV must not become a public or authenticated endpoint'
            exit 1
          fi
          test -z "$(git status --porcelain)"
