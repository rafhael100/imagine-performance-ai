name: Imagine Performance AI - F1-08 isolated PostgreSQL replay lab

on:
  push:
    branches:
      - dev/perf-f1-08-durable-replay-pg-lab-2026-11-08

permissions:
  contents: read

jobs:
  disposable-postgres-replay:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: perf_test_s2s_ci
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_test_s2s_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: perf_test_s2s_ci
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PERF_SNAPSHOT_FIXTURE: contracts/demo/performance-dashboard-v1.json
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Confirm disposable PostgreSQL and PHP
        shell: bash
        run: |
          set -euo pipefail
          php -v
          psql --version
          test "$PGDATABASE" = perf_test_s2s_ci
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
      - name: Validate F1-07 ephemeral-signature laboratory
        shell: bash
        run: |
          set -euo pipefail
          php contracts/lab/SyntheticS2SProtocolTest.php
      - name: Apply SQL schema only in isolated disposable database
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_s2s_lab_caller LOGIN PASSWORD 'ci-test-only-s2s-role'"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE perf_test_s2s_ci TO perf_s2s_lab_caller"
          psql -X -v ON_ERROR_STOP=1 -f contracts/lab/sql/001-replay-revocation-lab.sql
      - name: Test replay, cross-tenant denials and revocation after reconnect
        shell: bash
        run: |
          set -euo pipefail
          bash -n contracts/lab/sql/test-replay-revocation.sh
          bash contracts/lab/sql/test-replay-revocation.sh
