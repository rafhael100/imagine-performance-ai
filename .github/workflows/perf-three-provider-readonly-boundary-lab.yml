name: Performance Google Meta ChatGPT read-only transport boundary lab

on:
  pull_request:
    paths:
      - 'src/Domain/Commercial/AdsProviderReadOnlyBoundary.php'
      - 'src/Domain/Commercial/AdsReadOnlyHttpResponseReview.php'
      - 'tests/ads_provider_readonly_boundary_test.php'
      - 'tests/ads_readonly_http_response_review_test.php'
      - 'docs/performance-ai/PERF-THREE-PROVIDER-OFFICIAL-API-BOUNDARY-2026-11-14.md'
      - '.github/workflows/perf-three-provider-readonly-boundary-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP 8.4 isolated test runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
      - name: Lint provider request/response boundary and adversarial tests
        run: |
          php -l src/Domain/Commercial/AdsProviderReadOnlyBoundary.php
          php -l src/Domain/Commercial/AdsReadOnlyHttpResponseReview.php
          php -l tests/ads_provider_readonly_boundary_test.php
          php -l tests/ads_readonly_http_response_review_test.php
      - name: Validate all 3 providers and no network/billing
        env:
          APP_ENV: testing
          PERF_ADS_READONLY_BOUNDARY_LAB: '1'
        run: |
          php tests/ads_provider_readonly_boundary_test.php
          php tests/ads_readonly_http_response_review_test.php
