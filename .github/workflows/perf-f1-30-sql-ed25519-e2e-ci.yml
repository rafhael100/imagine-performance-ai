name: Performance F1-30 - Portal PostgreSQL authority through Ed25519 to fresh motor verification

on:
  push:
    branches:
      - dev/perf-f1-30-portal-sql-ed25519-e2e-2026-11-09

permissions:
  contents: read

concurrency:
  group: perf-f130-pg-signed-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-portal-signed-authority:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      portal-authority-postgresql:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f08-db-only
          POSTGRES_DB: portal_perf_auth_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_perf_auth_lab"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      PORTAL_PERF_PG_AUTH_LAB: '1'
      PORTAL_PERF_SIGNED_LAB: '1'
      PORTAL_PERF_SQL_ISSUER_LAB: '1'
      PERF_F29_SIGNED_PORTAL_LAB: '1'
      PERF_F30_PG_END_TO_END_LAB: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_perf_auth_lab
      DB_USERNAME: postgres
      DB_PASSWORD: ci-f08-db-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: portal_perf_auth_lab
      PGUSER: postgres
      PGPASSWORD: ci-f08-db-only
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      F30_PORTAL_SOURCE_ROOT: portal-signed-source
    steps:
      - name: Checkout Performance verifier code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout exact Portal F09 source code (never a moving branch)
        uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-portal
          ref: fc95f4bef1b2eab8eef2fcbb16fc6815e479dd21
          path: portal-signed-source
          persist-credentials: false
      - name: Pin the issuer SHA and ensure standalone sodium support
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C portal-signed-source rev-parse HEAD)" = fc95f4bef1b2eab8eef2fcbb16fc6815e479dd21
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d portal_perf_auth_lab
      - name: Install isolated PHP 8.4 with PostgreSQL and sodium
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo,pdo_pgsql,mbstring,dom,xml,curl,fileinfo,intl,bcmath,zip,sodium
      - name: Validate cross-repository domain and test-only PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -m | grep -i '^sodium$'
          php -l app/Performance/Security/SignedPortalCapabilityGate.php
          php -l app/Performance/Security/SyntheticCurrentAuthority.php
          php -l contracts/lab/php/test-portal-pg-signed-capability-e2e.php
          php -l portal-signed-source/apps/portal/app/Domain/PerformanceBridge/PortalPerfSqlAuthorityResolver.php
          php -l portal-signed-source/apps/portal/app/Domain/PerformanceBridge/PortalSqlBackedCapabilityIssuer.php
          php -l portal-signed-source/apps/portal/preview/tests/emit_pg_signed_perf_capability.php
      - name: Migrate only disposable Portal database using pinned Laravel source
        shell: bash
        run: |
          set -euo pipefail
          cd portal-signed-source/apps/portal
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          test "$DB_DATABASE" = portal_perf_auth_lab
          php artisan migrate --force --no-interaction
          cd ../../..
          git -C portal-signed-source diff --exit-code -- apps/portal/composer.lock
      - name: Create exact Portal database reader with SELECT only
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "CREATE ROLE portal_f08_reader LOGIN PASSWORD 'ci-f08-read-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT CONNECT ON DATABASE portal_perf_auth_lab TO portal_f08_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT USAGE ON SCHEMA public TO portal_f08_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT SELECT ON portal_perf_authority_sessions,portal_perf_authority_memberships,portal_perf_authority_services TO portal_f08_reader"
      - name: Seed and verify the actual 60+45 Portal PostgreSQL authority/issuer checks
        shell: bash
        run: |
          set -euo pipefail
          php portal-signed-source/apps/portal/preview/tests/test_pg_perf_authority.php
          php portal-signed-source/apps/portal/preview/tests/test_pg_signed_issuer.php
      - name: Cross repository SQL -> Ed25519 -> requery -> Performance (50 checks)
        shell: bash
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          export F30_PORTAL_CLAIM_FILE="$tempdir/portal-pg-signed.json"
          export F30_PORTAL_PUBLIC_HEX_FILE="$tempdir/portal-public.hex"
          php portal-signed-source/apps/portal/preview/tests/emit_pg_signed_perf_capability.php "$F30_PORTAL_PUBLIC_HEX_FILE" 1800000000 > "$F30_PORTAL_CLAIM_FILE"
          test "$(wc -c < "$F30_PORTAL_PUBLIC_HEX_FILE")" -eq 64
          php contracts/lab/php/test-portal-pg-signed-capability-e2e.php
          echo 'PASS Portal PG-backed Ed25519 claim verified with fresh PG source checks'
      - name: No production route, provider, VPS or cloud connection
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'SignedPortalCapabilityGate|SyntheticCurrentAuthority' app/Providers/ routes/ bootstrap/; then
            echo 'FAIL: lab verifier connected to live framework routing'
            exit 1
          fi
          git diff --exit-code -- app/Providers/ routes/ bootstrap/ composer.lock
