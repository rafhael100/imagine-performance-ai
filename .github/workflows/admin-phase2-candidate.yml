name: ADMIN phase2 isolated contracts and PG18 candidate
on:
  pull_request:
    paths: ['src/Domain/Administration/**','src/Domain/Commercial/ExactJsonNumberLexicalParser.php','contracts/admin/phase2/**','tests/admin_phase2*','tests/admin_phase3*','tests/admin_phase4_ads_connector_test.php','tests/admin_phase8_ads_wire_adapter_test.php','tests/admin_phase9_ads_account_test.php','tests/admin_phase10_ads_http_transport_test.php','tests/admin_phase11_ads_mandate_gate_test.php','tests/admin_phase11_ads_connector_denial_test.php','tests/admin_phase11_ads_provider_callback_failure_test.php','tests/admin_phase11_ads_read_trace_redaction_test.php','tests/admin_phase11_ads_return_lease_test.php','tests/admin_phase11_ads_malformed_row_test.php','tests/admin_phase11_ads_row_collection_shape_test.php','tests/admin_phase12_ads_ref_guard_test.php','tests/fixtures/ads-http/**','tests/docker/ads-http/**','tests/chatgpt_ads_exact_wire_money_test.php','.github/workflows/admin-phase2-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ads-wire-protocol:
    name: Ads read protocol PHP ${{ matrix.php }} without network
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build PHP curl and synthetic TLS peer image before isolation
        run: |
          docker build --pull --build-arg "PHP_VERSION=${{ matrix.php }}" \
            --tag "imagine-ads-http-ci:${{ matrix.php }}" tests/docker/ads-http
      - name: Provider wire, consent, pagination and legacy parser regressions
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            --add-host googleads.googleapis.com:127.0.0.1 \
            --add-host graph.facebook.com:127.0.0.1 \
            --user 65534:65534 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --workdir /workspace \
            "imagine-ads-http-ci:${{ matrix.php }}" sh -ec '
              php -l src/Domain/Administration/AdministrativeAdsWireFailure.php
              php -l src/Domain/Administration/AdministrativeAdsReadConnector.php
              php -l src/Domain/Administration/AdministrativeAdsReadHttpTransport.php
              php -l src/Domain/Administration/AdministrativeAdsAccountMandateGate.php
              php -l src/Domain/Administration/AdministrativeAdsBoundCredentialResolver.php
              php -l src/Domain/Administration/AdministrativeAdsReadWireAdapter.php
              php -l src/Domain/Commercial/ExactJsonNumberLexicalParser.php
              php tests/admin_phase3_read_plan_test.php
              php tests/admin_phase4_ads_connector_test.php
              php tests/admin_phase8_ads_wire_adapter_test.php
              php tests/admin_phase9_ads_account_test.php
              php tests/admin_phase11_ads_mandate_gate_test.php
              php tests/admin_phase11_ads_connector_denial_test.php
              php tests/admin_phase11_ads_provider_callback_failure_test.php
              php -l tests/admin_phase11_ads_read_trace_redaction_test.php
              php tests/admin_phase11_ads_read_trace_redaction_test.php
              php -l tests/admin_phase11_ads_return_lease_test.php
              php tests/admin_phase11_ads_return_lease_test.php
              php -l tests/admin_phase11_ads_malformed_row_test.php
              php tests/admin_phase11_ads_malformed_row_test.php
              php -l tests/admin_phase11_ads_row_collection_shape_test.php
              php tests/admin_phase11_ads_row_collection_shape_test.php
              php tests/admin_phase12_ads_ref_guard_test.php
              APP_ENV=testing \
                PERF_ADS_READONLY_BOUNDARY_LAB=1 \
                PERF_CHATGPT_AD_ACCOUNT_PREFLIGHT_LAB=1 \
                PERF_CHATGPT_EXACT_WIRE_MONEY_LAB=1 \
                php tests/chatgpt_ads_exact_wire_money_test.php
              bash tests/fixtures/ads-http/run.sh
            '
  contracts-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admin_phase2_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d admin_phase2_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none
      - run: php tests/admin_phase3_read_plan_test.php
      - run: php tests/admin_phase2_contract_test.php
      - run: php tests/admin_phase2_pg_test.php
        env:
          ADMIN_PHASE2_PG_CI: '1'
          ADMIN_PG_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=admin_phase2_ci'
      - name: Encrypt dump, verify integrity and restore into separate disposable database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/admin-backup-password"
          integrity_key="$(openssl rand -hex 32)"
          docker exec "$PG_CONTAINER" pg_dump -U postgres -d admin_phase2_ci -Fc \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/admin-backup-password" \
              -out "$RUNNER_TEMP/admin-backup.enc"
          before="$(openssl dgst -sha256 -mac HMAC -macopt "key:$integrity_key" "$RUNNER_TEMP/admin-backup.enc")"
          cp "$RUNNER_TEMP/admin-backup.enc" "$RUNNER_TEMP/admin-backup-tampered.enc"
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'admin-backup-tampered.enc'
          b=bytearray(p.read_bytes());b[-1]^=1;p.write_bytes(b)
          PYCODE
          tampered="$(openssl dgst -sha256 -mac HMAC -macopt "key:$integrity_key" "$RUNNER_TEMP/admin-backup-tampered.enc" | awk '{print $NF}')"
          test "${before##* }" != "$tampered"
          after="$(openssl dgst -sha256 -mac HMAC -macopt "key:$integrity_key" "$RUNNER_TEMP/admin-backup.enc")"
          test "$before" = "$after"
          docker exec "$PG_CONTAINER" createdb -U postgres admin_phase2_restored_ci
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$RUNNER_TEMP/admin-backup-password" \
              -in "$RUNNER_TEMP/admin-backup.enc" \
            | docker exec -i "$PG_CONTAINER" pg_restore -U postgres -d admin_phase2_restored_ci --exit-on-error
      - run: php tests/admin_phase2_restore_test.php
        env:
          ADMIN_PHASE2_PG_CI: '1'
          ADMIN_PG_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=admin_phase2_restored_ci'
      - name: Remove disposable encrypted backup and key
        if: always()
        run: rm -f "$RUNNER_TEMP/admin-backup-tampered.enc" "$RUNNER_TEMP/admin-backup.enc" "$RUNNER_TEMP/admin-backup-password"
