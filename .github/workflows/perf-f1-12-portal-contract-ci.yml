name: Imagine Performance AI - F1-12 Portal revocation contract parity

on:
  push:
    branches:
      - dev/perf-f1-12-portal-contract-parity-2026-11-08

permissions:
  contents: read

concurrency:
  group: perf-f112-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-portal-contract-relay:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: perf_test_relay_main
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_test_relay_main"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: perf_test_relay_main
      PERF_FENCE_DB: perf_test_relay_authority
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PERF_SNAPSHOT_FIXTURE: contracts/demo/performance-dashboard-v1.json
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: PHP 8.4 and PDO PG only
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo, pdo_pgsql
      - name: Lab syntax, JSON examples and disposable DB guard
        shell: bash
        run: |
          set -euo pipefail
          test "$PGDATABASE" = perf_test_relay_main
          test "$PERF_FENCE_DB" = perf_test_relay_authority
          php -l contracts/lab/php/SyntheticRevocationRelay.php
          php -l contracts/lab/php/test-revocation-relay-phases.php
          php -l contracts/lab/php/test-portal-revocation-contract.php
          php -r "json_decode(file_get_contents('contracts/lab/demo/perf-revocation-contract-v1.json'), true, 512, JSON_THROW_ON_ERROR); json_decode(file_get_contents('contracts/lab/demo/perf-revocation-event-example-v1.json'),true,512,JSON_THROW_ON_ERROR);"
          bash -n contracts/lab/sql/run-revocation-relay-pg-lab.sh
          pg_isready -h "$PGHOST" -p "$PGPORT" -U postgres -d "$PGDATABASE"
      - name: Run complete historical F1-11 relay and restore suite
        shell: bash
        run: |
          set -euo pipefail
          bash contracts/lab/sql/run-revocation-relay-pg-lab.sh
      - name: Import exact Portal contract fixture and prove F1-11 relay compatibility
        shell: bash
        run: |
          set -euo pipefail
          php contracts/lab/php/test-portal-revocation-contract.php
      - name: No operational entrypoints or deployment were touched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- routes database/migrations composer.json composer.lock
