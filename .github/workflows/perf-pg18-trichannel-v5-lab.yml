name: Performance PG18 V5 tri-channel nonce and finance close lab

on:
  pull_request:
    paths:
      - 'labs/finance-pg/PgTriChannelV5CandidateCloseLab.php'
      - 'tests/pg_trichannel_v5_atomic_close_e2e_test.php'
      - 'tests/pg_trichannel_v5_restored_replay_test.php'
      - 'src/Domain/Commercial/PortalTriChannelV5CandidateGuard.php'
      - 'docs/performance-ai/PERF-PORTAL-V5-PG18-TRICHANNEL-ATOMIC-2026-11-14.md'
      - '.github/workflows/perf-pg18-trichannel-v5-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg18-v5-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_postgres_password
          POSTGRES_DB: perf_fin_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_fin_lab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: testing
      PORTAL_PERF_TRICHANNEL_V5_LAB: '1'
      PERF_PORTAL_TRICHANNEL_V5_LAB: '1'
      PERF_PG_TRICHANNEL_V5_LAB: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: perf_fin_lab_test
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_postgres_password
      PERF_LAB_PG_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=perf_fin_lab_test'
      PERF_LAB_PG_USER: perf_fin_lab_app
      PERF_LAB_PG_PASSWORD: synthetic_ci_app_password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin exact real Portal V5 issuer source (read-only)
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-portal
          ref: 913f8e8420ecb26524c583d2e76bccd96133eb95
          path: portal-v5-reference
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: none
          coverage: none
      - name: PHP lint of V5 atomic close and restore
        run: |
          php -l labs/finance-pg/PgTriChannelV5CandidateCloseLab.php
          php -l tests/pg_trichannel_v5_atomic_close_e2e_test.php
          php -l tests/pg_trichannel_v5_restored_replay_test.php
          php -l src/Domain/Commercial/PortalTriChannelV5CandidateGuard.php
      - name: Provision disposable schema and least-privileged PG role with forced RLS
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_fin_lab_app LOGIN PASSWORD 'synthetic_ci_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
          psql -v ON_ERROR_STOP=1 -f labs/finance-pg/001_signed_quote_nonce.sql
          psql -v ON_ERROR_STOP=1 -f labs/finance-pg/002_reconciliation_drafts.sql
          psql -v ON_ERROR_STOP=1 -c "REVOKE ALL ON SCHEMA perf_fin_lab FROM PUBLIC"
          psql -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA perf_fin_lab TO perf_fin_lab_app"
          psql -v ON_ERROR_STOP=1 -c "GRANT SELECT,INSERT ON perf_fin_lab.signed_quote_nonces TO perf_fin_lab_app"
          psql -v ON_ERROR_STOP=1 -c "GRANT SELECT,INSERT ON perf_fin_lab.reconciliation_drafts TO perf_fin_lab_app"
      - name: Real Portal HMAC V5 to atomic nonce and immutable PG18 financial draft
        run: php tests/pg_trichannel_v5_atomic_close_e2e_test.php
      - name: Backup and restore V5 nonce/draft to separate ephemeral PG18 database
        run: |
          pg_dump --format=plain --no-owner --schema=perf_fin_lab --file=/tmp/perf-fin-v5-lab.sql
          sed -i '/^SET transaction_timeout = 0;$/d' /tmp/perf-fin-v5-lab.sql
          createdb --template=template0 perf_fin_lab_v5_restore
          psql -X -v ON_ERROR_STOP=1 --dbname=perf_fin_lab_v5_restore --file=/tmp/perf-fin-v5-lab.sql
      - name: Reject real HMAC V5 signed replay after restoring separate database
        env:
          PERF_LAB_RESTORE_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=perf_fin_lab_v5_restore'
        run: php tests/pg_trichannel_v5_restored_replay_test.php
