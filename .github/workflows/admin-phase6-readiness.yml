name: ADMIN Phase6 reviewed private transport readiness
on:
  push:
    branches: ['fix/admin-phase6-private-postgres-policy-2026-11-16']
permissions:
  contents: read
jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-phase4-service-ci
          POSTGRES_DB: performance_phase4_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d performance_phase4_ci" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CI: 'true'
      ADMIN_PHASE4_PG_CI: '1'
      PGPASSWORD: synthetic-phase4-service-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, openssl
          coverage: none
      - name: Executable composition and restricted persistent delegation
        run: |
          php -l deploy/private-admin/read.php
          php tests/admin_phase6_postgres_policy_test.php
          php tests/admin_phase4_service_test.php
          php tests/admin_phase6_service_isolation_test.php
          php tests/admin_phase4_ads_connector_test.php
