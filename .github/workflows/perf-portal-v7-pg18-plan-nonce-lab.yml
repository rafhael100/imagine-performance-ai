name: Performance V7 Portal signed plan nonce PG18 login RLS and restore

on:
  pull_request:
    paths:
      - 'labs/finance-pg/009_portal_v7_plan_signed_nonce_rls_lab.sql'
      - 'labs/finance-pg/PgPortalV7SignedPlanNonceLab.php'
      - 'tests/pg_portal_v7_signed_plan_nonce_e2e_test.php'
      - 'tests/pg_portal_v7_signed_plan_restore_replay_test.php'
      - 'docs/performance-ai/PERF-P0-V7-SIGNED-PLAN-PG18-DURABLE-NONCE-NOGO-2026-11-14.md'
      - '.github/workflows/perf-portal-v7-pg18-plan-nonce-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-plan-pg18-nonce:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_postgres_password
          POSTGRES_DB: perf_fin_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_fin_lab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: testing
      PORTAL_PERF_V7_PLAN_AGREEMENT_LAB: '1'
      PERF_PORTAL_F419_V7_REVIEW_LAB: '1'
      PERF_PORTAL_V7_SIGNED_PLAN_LAB: '1'
      PERF_PG_V6_ROLE_LAB: '1'
      PERF_PG_V7_PLAN_NONCE_LAB: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: perf_fin_lab_test
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_postgres_password
      PERF_LAB_PG_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=perf_fin_lab_test'
      PERF_ROLE_ALPHA_PASS: synthetic_ci_alpha_role_password
      PERF_ROLE_BETA_PASS: synthetic_ci_beta_role_password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin actual Portal V7 signed media plan PHP issuer
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-portal
          ref: 5437367b45a9258fabfe390183fe31fd40af4b8c
          path: portal-v7-plan-reference
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: none
          coverage: none
      - name: Strict PHP syntax
        run: |
          php -l labs/finance-pg/PgPortalV7SignedPlanNonceLab.php
          php -l tests/pg_portal_v7_signed_plan_nonce_e2e_test.php
          php -l tests/pg_portal_v7_signed_plan_restore_replay_test.php
          php -l src/Domain/Commercial/PortalV7SignedPlanAgreementLabVerifier.php
      - name: Create two independent authenticated SQL tenant login roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_v6_tenant_alpha LOGIN PASSWORD 'synthetic_ci_alpha_role_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE perf_v6_tenant_beta LOGIN PASSWORD 'synthetic_ci_beta_role_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
      - name: Create protected login registry and V7 plan nonce store with forced RLS
        run: |
          psql -v ON_ERROR_STOP=1 -f labs/finance-pg/005_v6_session_role_isolation_lab.sql
          psql -v ON_ERROR_STOP=1 -f labs/finance-pg/009_portal_v7_plan_signed_nonce_rls_lab.sql
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO perf_fin_role_lab.login_tenant_registry(login_role,tenant_id) VALUES ('perf_v6_tenant_alpha','tenant_v6multi_alpha_123456'),('perf_v6_tenant_beta','tenant_v6multi_beta_567890')"
          psql -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA perf_fin_role_lab TO perf_v6_tenant_alpha,perf_v6_tenant_beta"
          psql -v ON_ERROR_STOP=1 -c "GRANT EXECUTE ON FUNCTION perf_fin_role_lab.tenant_for_authenticated_session() TO perf_v6_tenant_alpha,perf_v6_tenant_beta"
          psql -v ON_ERROR_STOP=1 -c "GRANT SELECT,INSERT ON perf_fin_role_lab.portal_v7_plan_nonces TO perf_v6_tenant_alpha,perf_v6_tenant_beta"
      - name: Validate pinned Portal HMAC, agreement-specific PG18 nonce and cross-session replay
        run: php tests/pg_portal_v7_signed_plan_nonce_e2e_test.php
      - name: pg_dump protected nonce and tenant registry into an independent disposable DB
        run: |
          pg_dump --format=plain --no-owner --schema=perf_fin_role_lab --file=/tmp/perf-v7-plan-nonce.sql
          sed -i '/^SET transaction_timeout = 0;$/d' /tmp/perf-v7-plan-nonce.sql
          createdb --template=template0 perf_fin_role_restore
          psql -X -v ON_ERROR_STOP=1 --dbname=perf_fin_role_restore --file=/tmp/perf-v7-plan-nonce.sql
      - name: Confirm old claims survive restore and new claims still respect RLS
        env:
          PERF_LAB_RESTORE_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=perf_fin_role_restore'
        run: php tests/pg_portal_v7_signed_plan_restore_replay_test.php
