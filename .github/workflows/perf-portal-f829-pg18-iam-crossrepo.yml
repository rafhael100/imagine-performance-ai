name: Performance Portal F829 PostgreSQL18 authenticated-shaped V7 contract crossrepo CI

on:
  pull_request:
    paths:
      - 'tests/perf_portal_f829_pg18_iam_crossrepo_test.php'
      - '.github/workflows/perf-portal-f829-pg18-iam-crossrepo.yml'
      - 'docs/performance-ai/PERF-P0-PORTAL-F829-PG18-CROSSREPO-NOGO-2026-11-14.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-pg18-to-performance-v7:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f829-performance-only
          POSTGRES_DB: portal_identity_lab
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_identity_lab"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      PORTAL_PERF_V7_PG18_IDENTITY_LAB: '1'
      PORTAL_PERF_V7_PLAN_AGREEMENT_LAB: '1'
      PORTAL_PERF_V7_AUTHORITY_PREFLIGHT_LAB: '1'
      PORTAL_F829_EXPORT_SYNTHETIC: '1'
      PERF_PORTAL_V7_SIGNED_PLAN_LAB: '1'
      PERF_PORTAL_F419_V7_REVIEW_LAB: '1'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: portal_identity_lab
      DB_USERNAME: postgres
      DB_PASSWORD: ci-f829-performance-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: portal_identity_lab
      PGUSER: postgres
      PGPASSWORD: ci-f829-performance-only
      F66_PG_ADMIN_PASSWORD: ci-f829-performance-only
      PORTAL_V7_PG_READER_PASSWORD: ci-f829-reader-only
      PORTAL_V7_PG_UNPRIV_PASSWORD: ci-f829-unpriv-only
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    defaults:
      run:
        shell: bash
        working-directory: portal-f829-reference/apps/portal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin Portal PG18 real-shaped session and V7 agreement integration
        uses: actions/checkout@v4
        with:
          repository: rafhael100/imagine-portal
          ref: 57f90caf04bb94e16b52d6e18195f7a364564c15
          path: portal-f829-reference
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo,pdo_pgsql,mbstring,dom,xml,curl,fileinfo,intl,bcmath,zip,sodium
      - name: Install original Portal dependencies and isolated identity migration
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_09_000002_create_portal_identity_foundation.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_10_000004_add_org_revision_to_portal_sessions.php --force --no-interaction
          php artisan migrate --path=database/migrations/2026_11_10_000008_add_session_purpose_to_portal_auth_sessions.php --force --no-interaction
      - name: Grant minimal SQL permissions and create independent synthetic agreement contract
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE portal_f76_reader LOGIN PASSWORD 'ci-f76-unused-reader' NOSUPERUSER NOCREATEROLE NOCREATEDB NOINHERIT NOBYPASSRLS"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE portal_v7_lab_reader LOGIN PASSWORD 'ci-f829-reader-only' NOSUPERUSER NOCREATEROLE NOCREATEDB NOINHERIT NOBYPASSRLS"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE portal_v7_lab_unpriv LOGIN PASSWORD 'ci-f829-unpriv-only' NOSUPERUSER NOCREATEROLE NOCREATEDB NOINHERIT NOBYPASSRLS"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE portal_identity_lab TO portal_f76_reader,portal_v7_lab_reader,portal_v7_lab_unpriv"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO portal_f76_reader,portal_v7_lab_reader,portal_v7_lab_unpriv"
          psql -X -v ON_ERROR_STOP=1 -f labs/identity-f76/permission_gate.sql
          psql -X -v ON_ERROR_STOP=1 -f labs/performance-v7-pg18/portal_v7_agreement_preflight.sql
      - name: Real PostgreSQL18 IAM-shaped check before exporting redacted signed Portal V7 review
        run: |
          php -l labs/performance-v7-pg18/test_portal_v7_pg18_identity_agreement.php
          php labs/performance-v7-pg18/test_portal_v7_pg18_identity_agreement.php
          test -s /tmp/portal-f829-signed-plan-ci.json
      - name: Independent Performance verification of only the redacted signed commercial payload
        working-directory: .
        run: |
          php -l tests/perf_portal_f829_pg18_iam_crossrepo_test.php
          php tests/perf_portal_f829_pg18_iam_crossrepo_test.php
      - name: No Portal business routes, live payment or external Ads write
        run: |
          test "$(php artisan route:list --json | jq length)" -eq 1
          ! grep -R -E 'portal_v7_agreement_preflight_lab|PORTAL_PERF_V7_PG18_IDENTITY_LAB' routes/ bootstrap/ app/Providers/
