name: Performance F1-19 - SQL-backed admission facts across PostgreSQL restore

on:
  push:
    branches:
      - dev/perf-f1-19-sql-evidence-adapter-lab-2026-11-09

permissions:
  contents: read

concurrency:
  group: perf-f119-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-outbox-loopback:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: portal_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: perf_test_relay_main
      PERF_FENCE_DB: perf_test_relay_authority
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PERF_SNAPSHOT_FIXTURE: contracts/demo/performance-dashboard-v1.json
      PERF_F15_DIRECT_LAB: '1'
      PERF_WIRE_LAB_CLOCK: '1800000000'
    steps:
      - name: Checkout Performance AI
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout pinned public Portal F14 outbox worker
        uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-portal
          ref: 4e25fb628900366fe655423db7d97fcba10d3886
          path: portal-source
          persist-credentials: false
      - name: PHP 8.4 and locked Composer with PostgreSQL cURL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring,dom,xml,pdo,pdo_pgsql,curl,fileinfo,intl,bcmath,zip
      - name: Pure domain command policy - 62 adversarial checks
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -l src/Domain/Performance/ServiceActionAdmissionPolicy.php
          php -l tests/Unit/F118AdmissionStandalone.php
          php tests/Unit/F118AdmissionStandalone.php
          if grep -R -E 'ServiceActionAdmissionPolicy|ServiceAdmissionEvidence' app/ routes/; then
            echo 'FAIL: unfinished lab admission policy registered in operational route/provider'
            exit 1
          fi
      - name: Verify exact Portal SHA, wire parity and CLI-only code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C portal-source rev-parse HEAD)" = 4e25fb628900366fe655423db7d97fcba10d3886
          cmp portal-source/apps/portal/labs/performance-contract/SyntheticWireEnvelope.php contracts/lab/wire/SyntheticWireEnvelope.php
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = perf_test_relay_main
          php -l contracts/lab/wire/receiver-direct.php
          php -l contracts/lab/wire/test-direct-http-attacks.php
          php -l portal-source/apps/portal/labs/performance-contract/dispatch-loopback-outbox.php
          pg_isready -h "$PGHOST" -p "$PGPORT" -d portal_lab -U postgres
          if grep -R 'receiver-direct\|dispatch-loopback-outbox' app routes portal-source/apps/portal/routes/ portal-source/apps/portal/app/; then
            echo 'FAIL: direct lab wired into operational routes'
            exit 1
          fi
      - name: Bootstrap Portal MFA and create real test outbox revocation
        shell: bash
        env:
          PORTAL_CLIENT_LAB_ENABLED: '1'
          APP_ENV: testing
          APP_DEBUG: 'false'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: portal_lab
          DB_USERNAME: postgres
          DB_PASSWORD: local-ci-only
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: stderr
        run: |
          set -euo pipefail
          key="$(php -r 'echo bin2hex(random_bytes(32));')"
          echo "::add-mask::$key"
          echo "PERF_WIRE_LAB_TEST_KEY_HEX=$key" >> "$GITHUB_ENV"
          export PERF_WIRE_LAB_TEST_KEY_HEX="$key"
          export PORTAL_F13_EVENT_EXPORT="$RUNNER_TEMP/portal-perf-f13-event.json"
          echo "PERF_WIRE_EVENT_FIXTURE=$PORTAL_F13_EVENT_EXPORT" >> "$GITHUB_ENV"
          cd portal-source/apps/portal
          composer validate --strict --no-check-publish
          composer install --no-progress --no-interaction --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php labs/client-auth/bootstrap_lab.php
          php vendor/bin/phpunit --configuration=labs/client-auth/phpunit-lab.xml --no-progress
          export PORTAL_PERF_F11_LAB_ENABLED=1
          php labs/performance-contract/test-perf-f11-revocation.php
          test -s "$PORTAL_F13_EVENT_EXPORT"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d portal_lab             -f labs/performance-contract/portal-perf-f14-restricted-roles.sql
      - name: Build Performance baseline and test old backup restore
        shell: bash
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U postgres perf_test_relay_main
          bash contracts/lab/sql/run-revocation-relay-pg-lab.sh
      - name: Create isolated motor ingress SQL role and atomic receipts ledger
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c             "CREATE ROLE perf_test_wire_ingress LOGIN PASSWORD 'ci-only-direct-wire-ingress' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c             "GRANT CONNECT ON DATABASE perf_test_relay_main TO perf_test_wire_ingress"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -q -f contracts/lab/sql/005-direct-wire-receipts.sql
      - name: Exercise real Portal outbox worker over local HTTP and failure recovery
        shell: bash
        env:
          PORTAL_CLIENT_LAB_ENABLED: '1'
          PORTAL_PERF_F11_LAB_ENABLED: '1'
          PORTAL_PERF_F14_LAB_ENABLED: '1'
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: portal_lab
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/perf-f15-direct-http.log"
          php -S 127.0.0.1:18784 contracts/lab/wire/receiver-direct.php > "$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl --noproxy '*' -sS --connect-timeout 1 --max-time 2 -o /dev/null               http://127.0.0.1:18784/_synthetic/perf/revocation 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'FAIL F15 listener exited unexpectedly'
              tail -n 60 "$log"
              exit 1
            fi
            sleep 0.1
          done
          test "$ready" -eq 1

          # Adversarial HTTP requests must not change grants or receipts.
          if ! php contracts/lab/wire/test-direct-http-attacks.php; then
            tail -n 60 "$log"
            exit 1
          fi
          dispatcher="portal-source/apps/portal/labs/performance-contract/dispatch-loopback-outbox.php"
          export PORTAL_PERF_F14_DISPATCH_MODE=transport_loss
          test "$(php "$dispatcher")" = "PASS F14 relay_transport_deferred_demo"
          test "$(psql -X -A -t -d "$PGDATABASE" -c 'SELECT count(*) FROM perf_s2s_lab.mock_direct_wire_receipts')" = 0

          # Simulate receiver commit followed by lost ACK. Source remains pending.
          export PORTAL_PERF_F14_DISPATCH_MODE=ack_loss
          test "$(php "$dispatcher")" = "PASS F14 relay_ack_deferred_demo"
          test "$(psql -X -A -t -d "$PGDATABASE" -c 'SELECT count(*) FROM perf_s2s_lab.mock_direct_wire_receipts')" = 1
          test "$(psql -X -A -t -d portal_lab -c "SELECT status FROM lab_portal_perf_revocation_outbox WHERE service_ref='svc-demo-b'")" = pending

          # Retry with a fresh nonce. The destination returns a durable 409,
          # and the Portal ACKs exactly once through its restricted role.
          export PORTAL_PERF_F14_DISPATCH_MODE=retry
          test "$(php "$dispatcher")" = "PASS F14 relay_already_applied_and_ack_demo"
          test "$(psql -X -A -t -d portal_lab -c "SELECT status FROM lab_portal_perf_revocation_outbox WHERE service_ref='svc-demo-b'")" = acked
          test "$(psql -X -A -t -d portal_lab -c "SELECT attempts FROM lab_portal_perf_revocation_outbox WHERE service_ref='svc-demo-b'")" = 1
          export PORTAL_PERF_F14_DISPATCH_MODE=deliver
          test "$(php "$dispatcher")" = "PASS F14 already_acked_demo"

          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT grant_revision FROM perf_s2s_lab.mock_service_grants WHERE service_ref='svc-demo-b'")" = 2
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT active FROM perf_s2s_lab.mock_service_grants WHERE service_ref='svc-demo-b'")" = f
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT grant_revision FROM perf_s2s_lab.mock_service_grants WHERE service_ref='svc-demo-a'")" = 6
          test "$(psql -X -A -t -d "$PGDATABASE" -c 'SELECT count(*) FROM perf_s2s_lab.mock_direct_wire_receipts')" = 1
          echo 'PASS F15 direct outbox → signed loopback → atomic motor revoke → lost ACK retry'
      - name: Restore older real Performance backup after Portal outbox was ACKed
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/perf-f1-11-old-main.dump"
          test -s "$backup"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c 'DROP SCHEMA perf_s2s_lab CASCADE'
          pg_restore --no-owner --exit-on-error --dbname="$PGDATABASE" "$backup"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            'REVOKE ALL ON FUNCTION perf_s2s_lab.mock_claim(text,text,text,integer,text,text,text,text) FROM PUBLIC'
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            'GRANT USAGE ON SCHEMA perf_s2s_lab TO perf_s2s_lab_caller'
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            'GRANT EXECUTE ON FUNCTION perf_s2s_lab.mock_claim(text,text,text,integer,text,text,text,text) TO perf_s2s_lab_caller'
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -q -f contracts/lab/sql/005-direct-wire-receipts.sql
          psql -X -v ON_ERROR_STOP=1 -d "$PERF_FENCE_DB" -c \
            'GRANT SELECT ON perf_external_lab.mock_authority_fences TO perf_test_fence_reader'
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT grant_revision FROM perf_s2s_lab.mock_service_grants WHERE service_ref='svc-demo-b'")" = 1
          test "$(psql -X -A -t -d portal_lab -c "SELECT status FROM lab_portal_perf_revocation_outbox WHERE service_ref='svc-demo-b'")" = acked
      - name: Set up source and local recovery epochs on disposable PG after old restore
        shell: bash
        run: |
          set -euo pipefail
          php -l contracts/lab/php/SyntheticSqlAdmissionEvidenceReader.php
          php -l contracts/lab/php/test-sql-admission-evidence.php
          psql -X -v ON_ERROR_STOP=1 -d portal_lab -q -f contracts/lab/sql/007-portal-restore-epoch-lab.sql
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -q -f contracts/lab/sql/008-performance-restore-epoch-lab.sql
      - name: SQL evidence denies action while service is restored and epochs differ
        shell: bash
        env:
          APP_ENV: testing
          PERF_F18_ADMISSION_LAB: '1'
          PERF_F19_SQL_ADAPTER_LAB: '1'
          PERF_F19_MOCK_ATTESTED: '1'
          PERF_F19_PHASE: post_restore
          PORTAL_RECONCILE_DATABASE: portal_lab
        run: |
          set -euo pipefail
          php contracts/lab/php/test-sql-admission-evidence.php
      - name: Gate synthetic campaign changes during the unsafe restore interval
        shell: bash
        env:
          PERF_F17_ELIGIBILITY_LAB: '1'
          PERF_F17_TEST_PHASE: before_reconcile
          PORTAL_RECONCILE_DATABASE: portal_lab
        run: |
          set -euo pipefail
          php -l contracts/lab/php/SyntheticPortalEligibilityGate.php
          php -l contracts/lab/php/test-restore-eligibility-quarantine.php
          php contracts/lab/php/test-restore-eligibility-quarantine.php
      - name: Fail closed and reconcile from current Portal state despite ACKed event
        shell: bash
        env:
          PERF_F16_RESTORE_LAB: '1'
          PORTAL_RECONCILE_DATABASE: portal_lab
        run: |
          set -euo pipefail
          php -l contracts/lab/php/SyntheticPortalRestoreReconciler.php
          php -l contracts/lab/php/test-portal-restore-reconciliation.php
          php contracts/lab/php/test-portal-restore-reconciliation.php
      - name: SQL evidence still blocks after service grant reconciliation (epoch lag)
        shell: bash
        env:
          APP_ENV: testing
          PERF_F18_ADMISSION_LAB: '1'
          PERF_F19_SQL_ADAPTER_LAB: '1'
          PERF_F19_MOCK_ATTESTED: '1'
          PERF_F19_PHASE: post_reconcile
          PORTAL_RECONCILE_DATABASE: portal_lab
        run: |
          set -euo pipefail
          php contracts/lab/php/test-sql-admission-evidence.php
      - name: Gate synthetic campaign changes after sync while Portal grant remains revoked
        shell: bash
        env:
          PERF_F17_ELIGIBILITY_LAB: '1'
          PERF_F17_TEST_PHASE: after_reconcile
          PORTAL_RECONCILE_DATABASE: portal_lab
        run: |
          set -euo pipefail
          php contracts/lab/php/test-restore-eligibility-quarantine.php
      - name: Mark local recovery epoch ready but still reject revoked service
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "UPDATE perf_s2s_lab.mock_restore_epochs SET epoch=2,state='ready_mock' WHERE service_ref='svc-demo-b' AND epoch=1"
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT epoch FROM perf_s2s_lab.mock_restore_epochs WHERE service_ref='svc-demo-b'")" = 2
      - name: SQL evidence never confuses readiness with permission on revoked service
        shell: bash
        env:
          APP_ENV: testing
          PERF_F18_ADMISSION_LAB: '1'
          PERF_F19_SQL_ADAPTER_LAB: '1'
          PERF_F19_MOCK_ATTESTED: '1'
          PERF_F19_PHASE: epoch_ready
          PORTAL_RECONCILE_DATABASE: portal_lab
        run: |
          set -euo pipefail
          php contracts/lab/php/test-sql-admission-evidence.php
      - name: Verify main product routes, migrations and lockfiles remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- routes database/migrations composer.json composer.lock
          git -C portal-source diff --exit-code -- apps/portal/routes/web.php apps/portal/bootstrap/app.php apps/portal/composer.lock
