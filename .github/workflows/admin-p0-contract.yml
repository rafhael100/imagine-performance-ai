name: ADMIN P0 engine contract - isolated synthetic only
on:
  pull_request:
    paths: ['src/Domain/Administration/**', 'contracts/admin/**', 'tests/administrative_lab_engine_test.php', '.github/workflows/admin-p0-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laboratory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: php tests/administrative_lab_engine_test.php
      - run: php tests/monthly_management_fee_floor_v7_candidate_test.php
