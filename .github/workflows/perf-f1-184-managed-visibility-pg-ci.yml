name: Performance F1-184 - filter unmanaged campaigns in F100 SQL views

on:
  push:
    branches:
      - dev/perf-f1-184-managed-campaign-visibility-pg16-2026-11-11
  pull_request:
    paths:
      - 'tests/Standalone/F176CurrentPortalF62ContractTest.php'
      - 'tests/Standalone/F177F100MultiViewConsistencyRaceTest.php'
      - 'tests/Standalone/F178RealPortalF63SqlHtmlTest.php'
      - 'tests/Standalone/F179SignedPortalToF63CanonicalE2ETest.php'
      - 'contracts/lab/php/SyntheticPostReceiptF100Delivery.php'
      - 'tests/Standalone/F180PostReceiptSnapshotDeliveryTest.php'
      - 'contracts/lab/php/SyntheticF181BoundPortalHtml.php'
      - 'tests/Standalone/F181BoundPortalHtmlIntegrityTest.php'
      - 'tests/Standalone/F182TwoTenantPortalHtmlTest.php'
      - 'database/f184-lab-migrations/2026_11_11_000001_filter_unmanaged_credential_views.php'
      - 'tests/Standalone/F184UnmanagedCampaignViewsPgTest.php'
      - '.github/workflows/perf-f1-184-managed-visibility-pg-ci.yml'
      - '.github/workflows/perf-f1-182-two-tenant-portal-html-ci.yml'
      - '.github/workflows/perf-f1-181-integrity-bound-f63-ci.yml'
      - '.github/workflows/perf-f1-180-post-receipt-f100-delivery-ci.yml'
      - '.github/workflows/perf-f1-179-signed-portal-f63-e2e-ci.yml'
      - '.github/workflows/perf-f1-178-portal-f63-real-pg-html-ci.yml'
      - 'app/Performance/ReadSide/CredentialBoundDemoWorkbenchReader.php'
      - '.github/workflows/perf-f1-177-f100-multiview-consistency-ci.yml'
      - '.github/workflows/perf-f1-176-real-f100-current-portal-ci.yml'
      - 'docs/execucao/FAST-PERF-F1-176-F100-PORTAL-F62-PG16-CANONICAL-PATH.md'

permissions:
  contents: read

concurrency:
  group: perf-f1184-managed-visibility-pg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-campaign-storage:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-f22-db-only
          POSTGRES_DB: perf_test_campaign_registry
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_test_campaign_registry"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: perf_test_campaign_registry
      DB_USERNAME: postgres
      DB_PASSWORD: ci-f22-db-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: perf_test_campaign_registry
      PGUSER: postgres
      PGPASSWORD: ci-f22-db-only
      RUN_PERF_F22_PG_LAB: '1'
      LOG_CHANNEL: stderr
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: PHP 8.4, Composer locked dependencies and PostgreSQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo,pdo_pgsql,mbstring,dom,xml,curl,fileinfo,intl,bcmath,zip,sodium
      - name: Validate migrations, deny deployment wiring
        shell: bash
        run: |
          set -euo pipefail
          php -l database/migrations/2026_11_09_000005_create_performance_campaigns_and_intents.php
          php -l database/migrations/2026_11_09_000006_enable_campaign_intent_rls.php
          php -l contracts/lab/php/test-campaign-intents-pg.php
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d perf_test_campaign_registry
          if grep -R -E 'performance_campaign_intents|performance_managed_campaigns' routes/ bootstrap/ app/Providers/; then
            echo 'FAIL test-only persistence wired into operational route/provider/bootstrap'
            exit 1
          fi
      - name: Install exact Composer.lock with no scripts/plugins
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
          composer dump-autoload --no-interaction --no-scripts --no-plugins
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          git diff --exit-code -- composer.lock
      - name: Apply Laravel migrations only to disposable perf_test_campaign_registry
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = perf_test_campaign_registry
          php artisan migrate --force --no-interaction
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "CREATE ROLE perf_campaign_test_user LOGIN PASSWORD 'ci-f22-role-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT CONNECT ON DATABASE perf_test_campaign_registry TO perf_campaign_test_user"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT USAGE ON SCHEMA public TO perf_campaign_test_user"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT SELECT,INSERT,UPDATE,DELETE ON performance_managed_campaigns, performance_campaign_intents TO perf_campaign_test_user"
      - name: Test tenant isolation, SQL constraints and disabled Ads dispatch
        shell: bash
        run: |
          set -euo pipefail
          php contracts/lab/php/test-campaign-intents-pg.php
      - name: Create least-privilege F23 ledger role only on disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          php -l contracts/lab/php/SyntheticCampaignApprovalLedger.php
          php -l contracts/lab/php/test-campaign-approval-ledger-pg.php
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "CREATE ROLE perf_f23_writer LOGIN PASSWORD 'ci-f23-ledger-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT CONNECT ON DATABASE perf_test_campaign_registry TO perf_f23_writer"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT USAGE ON SCHEMA public TO perf_f23_writer"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT SELECT ON performance_managed_campaigns, operational_memberships TO perf_f23_writer"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT SELECT,INSERT,UPDATE ON performance_campaign_intents TO perf_f23_writer"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT SELECT,INSERT ON audit_events TO perf_f23_writer"
      - name: Run 56 atomic proposal, independent review, rollback and audit checks
        shell: bash
        env:
          PERF_F23_LEDGER_LAB: '1'
        run: |
          set -euo pipefail
          php contracts/lab/php/test-campaign-approval-ledger-pg.php
          if grep -R 'SyntheticCampaignApprovalLedger' app/ routes/ bootstrap/; then
            echo 'FAIL F23 laboratory ledger accidentally wired into operational Laravel'
            exit 1
          fi
      - name: Create SELECT-only F24 projection role under tenant RLS
        shell: bash
        run: |
          set -euo pipefail
          php -l contracts/lab/php/SyntheticCampaignPortalProjection.php
          php -l contracts/lab/php/test-campaign-portal-projection-pg.php
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "CREATE ROLE perf_f24_reader LOGIN PASSWORD 'ci-f24-read-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT CONNECT ON DATABASE perf_test_campaign_registry TO perf_f24_reader"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT USAGE ON SCHEMA public TO perf_f24_reader"
          psql -X -v ON_ERROR_STOP=1 -d perf_test_campaign_registry -c \
            "GRANT SELECT ON performance_managed_campaigns,performance_campaign_intents TO perf_f24_reader"
      - name: Verify 50 synthetic Portal read-model privacy and fail-closed checks
        shell: bash
        env:
          PERF_F24_READ_MODEL_LAB: '1'
        run: |
          set -euo pipefail
          php contracts/lab/php/test-campaign-portal-projection-pg.php
          if grep -R 'SyntheticCampaignPortalProjection' app/ routes/ bootstrap/; then
            echo 'FAIL: offline projection wired to operational web/API'
            exit 1
          fi
      - name: Export the real synthetic SQL snapshot and assert byte-identical pinned JSON
        shell: bash
        env:
          PERF_F24_READ_MODEL_LAB: '1'
          PERF_F25_EXPORT_LAB: '1'
        run: |
          set -euo pipefail
          php -l tools/export-performance-pg-preview-demo.php
          php tools/export-performance-pg-preview-demo.php > "$RUNNER_TEMP/performance-storage-preview-v1.json"
          test -s "$RUNNER_TEMP/performance-storage-preview-v1.json"
          diff -u contracts/demo/performance-storage-preview-v1.json "$RUNNER_TEMP/performance-storage-preview-v1.json"
          sha256sum contracts/demo/performance-storage-preview-v1.json
          echo 'PASS F1-25 PostgreSQL rows match versioned JSON fixture byte-for-byte'
      - name: Verify PostgreSQL approval integrity guard under direct SQL tampering
        shell: bash
        env:
          PERF_F26_INTEGRITY_LAB: '1'
        run: |
          set -euo pipefail
          php -l database/migrations/2026_11_09_000007_guard_campaign_intent_row_integrity.php
          php -l contracts/lab/php/test-intent-transition-guard-pg.php
          php contracts/lab/php/test-intent-transition-guard-pg.php
          test "$(psql -X -A -t -d "$PGDATABASE" -c "SELECT count(*) FROM pg_trigger WHERE tgname='perf_f26_intent_row_guard' AND tgenabled='O'")" = 1
          if grep -R -E 'perf_f26_guard_intent_row|test-intent-transition-guard-pg' app/ routes/ bootstrap/; then
            echo 'FAIL: integrity lab referenced in operational Laravel route/provider'
            exit 1
          fi
      - name: Grant isolated SELECT-only journal reader and validate SQL trigger syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l database/migrations/2026_11_09_000008_create_intent_review_journal_pg.php
          php -l contracts/lab/php/test-intent-review-journal-pg.php
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "CREATE ROLE perf_f27_journal_reader LOGIN PASSWORD 'ci-f27-reader-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT CONNECT ON DATABASE perf_test_campaign_registry TO perf_f27_journal_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT USAGE ON SCHEMA public TO perf_f27_journal_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT SELECT ON performance_intent_review_journal TO perf_f27_journal_reader"
      - name: Verify 50 synthetic RLS-journal and transactional rollback assertions
        shell: bash
        env:
          PERF_F27_JOURNAL_LAB: '1'
        run: |
          set -euo pipefail
          php contracts/lab/php/test-intent-review-journal-pg.php
          if grep -R -E 'perf_f27_capture_review_transition|perf_f27_journal_reader' app/ routes/ bootstrap/; then
            echo 'FAIL F27 triggered audit SQL referenced in active product code'
            exit 1
          fi
      - name: Create SELECT-only internal Laravel F28 workbench role
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Performance/ReadSide/SyntheticWorkbenchScope.php
          php -l app/Performance/ReadSide/SyntheticCampaignWorkbenchReader.php
          php -l contracts/lab/php/test-laravel-campaign-workbench-pg.php
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "CREATE ROLE perf_f28_app_reader LOGIN PASSWORD 'ci-f28-app-read-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT CONNECT ON DATABASE perf_test_campaign_registry TO perf_f28_app_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT USAGE ON SCHEMA public TO perf_f28_app_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c \
            "GRANT SELECT ON portal_service_links,performance_managed_campaigns,performance_campaign_intents,performance_intent_review_journal TO perf_f28_app_reader"
      - name: Run 50 actual Laravel application-class read-model/tenant safety checks
        shell: bash
        env:
          PERF_F28_APP_READ_LAB: '1'
        run: |
          set -euo pipefail
          php contracts/lab/php/test-laravel-campaign-workbench-pg.php
          if grep -R 'SyntheticCampaignWorkbenchReader' routes/ bootstrap/ app/Providers/; then
            echo 'FAIL F28 read-side accidentally registered in runtime routing/provider'
            exit 1
          fi
      - name: F84 project actual F28 PostgreSQL read-model into safe Portal candidate
        shell: bash
        env:
          PERF_F28_APP_READ_LAB: '1'
          PERF_F84_WORKBENCH_LAB: '1'
          PERF_F84_OUTPUT_FILE: ${{ runner.temp }}/perf-f84-output.json
        run: |
          set -euo pipefail
          php -l app/Performance/Contracts/PortalPerformanceChannelContract.php
          php -l app/Performance/Contracts/PortalWorkbenchOfflineProjection.php
          php -l contracts/lab/php/test-f84-portal-projection-pg.php
          php contracts/lab/php/test-f84-portal-projection-pg.php
          if grep -R -n -E 'PortalWorkbenchOfflineProjection|PERF_F84_WORKBENCH_LAB' routes/ bootstrap/ app/Providers/; then
            echo 'FAIL F84 offline projection referenced in operational routing/providers'
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: rafhael100/imagine-portal
          ref: a8783d0009b60b6865135269a8a63ce60094c530
          path: pinned-portal
          persist-credentials: false
          sparse-checkout: |
            apps/portal/app/Domain/Catalog/PerformanceChannel.php
            apps/portal/app/Domain/Organizations/OrganizationId.php
            apps/portal/app/Domain/PerformanceOnboarding/DemoOnboardingId.php
            apps/portal/app/Domain/PerformanceOnboarding/DemoPerformanceEvent.php
            apps/portal/app/Domain/PerformanceOnboarding/DemoAdAccount.php
            apps/portal/app/Domain/PerformanceDashboard/PerformanceCampaignObservationState.php
            apps/portal/app/Domain/PerformanceDashboard/PerformanceReviewObservationState.php
            apps/portal/app/Domain/PerformanceDashboard/OfflinePerformanceWorkbenchPreview.php
            apps/portal/tests/Unit/PerformanceObservationStateContractStandalone.php
            apps/portal/tests/Unit/OfflinePerformanceWorkbenchPreviewStandalone.php
            apps/portal/tools/f60-render-performance-workbench.php
            apps/portal/tests/ui/test-f60-static-workbench.mjs
            apps/portal/tests/Fixtures/performance-workbench-offline-v1.json
      - name: F82-F86 SQL-backed Portal contract and HTML end-to-end
        shell: bash
        env:
          PORTAL_PERFORMANCE_ENUM_PATH: pinned-portal/apps/portal/app/Domain/Catalog/PerformanceChannel.php
          PORTAL_CHECKOUT_ROOT: pinned-portal
          PORTAL_F59_WORKBENCH_LAB: '1'
          PORTAL_F60_HTML_LAB: '1'
        run: |
          set -euo pipefail
          php tests/Unit/PortalPerformanceChannelContractStandalone.php
          php tests/Unit/PortalOnboardingEventContractStandalone.php
          test -s "$RUNNER_TEMP/perf-f84-output.json"
          php pinned-portal/apps/portal/tests/Unit/PerformanceObservationStateContractStandalone.php
          php pinned-portal/apps/portal/tests/Unit/OfflinePerformanceWorkbenchPreviewStandalone.php "$RUNNER_TEMP/perf-f84-output.json"
          ( cd pinned-portal && node apps/portal/tests/ui/test-f60-static-workbench.mjs "$RUNNER_TEMP/perf-f84-output.json" )

      - name: F88 real PostgreSQL tenant-bound ad account candidate registry
        shell: bash
        env:
          PERF_F88_AD_ACCOUNT_PG_LAB: '1'
        run: |
          set -euo pipefail
          php -l database/migrations/2026_11_09_000009_create_performance_ad_account_candidates.php
          php -l contracts/lab/php/test-f88-ad-account-candidates-pg.php
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "CREATE ROLE perf_f88_registrar LOGIN PASSWORD 'ci-f88-registrar-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT CONNECT ON DATABASE perf_test_campaign_registry TO perf_f88_registrar"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT USAGE ON SCHEMA public TO perf_f88_registrar"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT SELECT,INSERT ON performance_ad_account_candidates TO perf_f88_registrar"
          php contracts/lab/php/test-f88-ad-account-candidates-pg.php
          if grep -R -n -E 'performance_ad_account_candidates|PERF_F88_AD_ACCOUNT_PG_LAB' routes/ bootstrap/ app/Providers/; then
            echo 'FAIL F88 ad-account enrollment exposed to HTTP runtime'
            exit 1
          fi

      - name: F89 strict tenant/service/channel FK in real PostgreSQL RLS
        shell: bash
        env:
          PERF_F89_ACCOUNT_LINK_PG_LAB: '1'
        run: |
          set -euo pipefail
          php -l database/migrations/2026_11_09_000010_create_performance_campaign_account_links.php
          php -l contracts/lab/php/test-f89-campaign-account-links-pg.php
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "CREATE ROLE perf_f89_link_registrar LOGIN PASSWORD 'ci-f89-link-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT CONNECT ON DATABASE perf_test_campaign_registry TO perf_f89_link_registrar"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT USAGE ON SCHEMA public TO perf_f89_link_registrar"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT SELECT,INSERT ON performance_campaign_account_links TO perf_f89_link_registrar"
          php contracts/lab/php/test-f89-campaign-account-links-pg.php
          if grep -R -n -E 'performance_campaign_account_links|PERF_F89_ACCOUNT_LINK_PG_LAB' routes/ bootstrap/ app/Providers/; then
            echo 'FAIL F89 account-campaign links used by operational HTTP'
            exit 1
          fi

      - name: F90 SQL RLS -> actual Portal DemoAdAccount PHP under read-only role
        shell: bash
        env:
          PERF_F90_REAL_PORTAL_ACCOUNT_PG_LAB: '1'
          PORTAL_CHECKOUT_ROOT: pinned-portal
        run: |
          set -euo pipefail
          php -l contracts/lab/php/test-f90-portal-demo-ad-account-pg.php
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "CREATE ROLE perf_f90_projection_reader LOGIN PASSWORD 'ci-f90-reader-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT CONNECT ON DATABASE perf_test_campaign_registry TO perf_f90_projection_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT USAGE ON SCHEMA public TO perf_f90_projection_reader"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT SELECT ON performance_campaign_account_links,performance_ad_account_candidates,performance_managed_campaigns TO perf_f90_projection_reader"
          php contracts/lab/php/test-f90-portal-demo-ad-account-pg.php
          if grep -R -n 'test-f90-portal-demo-ad-account-pg' routes/ bootstrap/ app/Providers/; then
            echo 'FAIL F90 regression: test-only Portal account comparison wired into routing'
            exit 1
          fi

      - name: F91 authenticated DB principal tenant scope, GUC spoof and revocation
        shell: bash
        env:
          PERF_F91_DB_PRINCIPAL_LAB: '1'
        run: |
          set -euo pipefail
          php -l database/migrations/2026_11_09_000011_create_principal_bound_demo_account_read.php
          php -l contracts/lab/php/test-f91-db-principal-tenant-view-pg.php
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "CREATE ROLE perf_f91_reader_a LOGIN PASSWORD 'ci-f91-only-a' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "CREATE ROLE perf_f91_reader_b LOGIN PASSWORD 'ci-f91-only-b' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT CONNECT ON DATABASE perf_test_campaign_registry TO perf_f91_reader_a, perf_f91_reader_b"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT USAGE ON SCHEMA public TO perf_f91_reader_a, perf_f91_reader_b"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT SELECT ON public.perf_f91_demo_account_read TO perf_f91_reader_a, perf_f91_reader_b"
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT EXECUTE ON FUNCTION public.perf_f91_tenant_for_login() TO perf_f91_reader_a, perf_f91_reader_b"
          php contracts/lab/php/test-f91-db-principal-tenant-view-pg.php
          if grep -R -n -E 'perf_f91_tenant_for_login|PERF_F91_DB_PRINCIPAL_LAB' routes/ bootstrap/ app/Providers/; then
            echo 'FAIL F91 credential-bound lab view wired into operational runtime'
            exit 1
          fi

      - name: F92 Laravel-ready VIEW reader vs real Portal DemoAdAccount
        shell: bash
        env:
          PERF_F92_CREDENTIAL_READER_LAB: '1'
          PORTAL_CHECKOUT_ROOT: pinned-portal
        run: |
          set -euo pipefail
          php -l app/Performance/ReadSide/CredentialBoundDemoAccountReader.php
          php -l contracts/lab/php/test-f92-credential-bound-account-reader-pg.php
          php contracts/lab/php/test-f92-credential-bound-account-reader-pg.php
          if grep -R -n -E 'CredentialBoundDemoAccountReader|PERF_F92_CREDENTIAL_READER_LAB' routes/ bootstrap/ app/Providers/; then
            echo 'FAIL F92 credential reader is test-only and cannot be routed publicly'
            exit 1
          fi

      - name: F93 login-bound DEMO campaign-account VIEW against tenant GUC spoof
        shell: bash
        env:
          PERF_F93_LOGIN_CAMPAIGN_LAB: '1'
        run: |
          set -euo pipefail
          php -l database/migrations/2026_11_10_000001_create_credential_bound_campaign_account_read.php
          php -l contracts/lab/php/test-f93-credential-bound-campaign-links-pg.php
          psql -X -v ON_ERROR_STOP=1 -d "$PGDATABASE" -c "GRANT SELECT ON public.perf_f93_demo_campaign_account_read TO perf_f91_reader_a,perf_f91_reader_b"
          php contracts/lab/php/test-f93-credential-bound-campaign-links-pg.php
          if grep -R -n -E 'perf_f93_demo_campaign_account_read|PERF_F93_LOGIN_CAMPAIGN_LAB' routes/ bootstrap/ app/Providers/; then
            echo 'FAIL F93 lab view registered in public Laravel runtime'
            exit 1
          fi

      - name: F94 Laravel campaign reader vs real Portal campaign observation enum
        shell: bash
        env:
          PERF_F94_CREDENTIAL_CAMPAIGN_LAB: '1'
          PORTAL_CHECKOUT_ROOT: pinned-portal
        run: |
          set -euo pipefail
          php -l app/Performance/ReadSide/CredentialBoundDemoCampaignReader.php
