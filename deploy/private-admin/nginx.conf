worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
 log_format sanitized '$request_id $status $request_time';
 access_log /dev/stdout sanitized;
 error_log /dev/stderr warn;
 client_body_temp_path /tmp/client_body;
 fastcgi_temp_path /tmp/fastcgi;
 server {
  listen 8443 ssl;
  server_name performance.internal;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /run/tls/server.pem;
  ssl_certificate_key /run/tls/server.key;
  ssl_client_certificate /run/tls/clients-ca.pem;
  ssl_crl /run/tls/clients.crl;
  ssl_verify_client on;
  ssl_verify_depth 2;
  client_max_body_size 16k;
  client_body_timeout 5s;
  location = /v1/admin/read {
   limit_except POST { deny all; }
   include /etc/nginx/fastcgi_params;
   fastcgi_param SCRIPT_FILENAME /app/deploy/private-admin/read.php;
   fastcgi_param IMAGINE_TLS_VERIFY $ssl_client_verify;
   fastcgi_param IMAGINE_TLS_CERT $ssl_client_escaped_cert;
   fastcgi_read_timeout 8s;
   fastcgi_connect_timeout 2s;
   fastcgi_pass receiver:9000;
  }
  location / { return 404; }
 }
}
